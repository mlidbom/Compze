# Push CI: on every push to any branch, build and run the full pluggable-component matrix (the build-and-test jobs), unless
# an earlier CI run already covers the pushed commit.
#
# A CI run covers a commit when it is a run of that commit, or of a commit that differs from it only in files CI doesn't
# test, such as documentation: .github/scripts/lib/CiCoverage.ps1 says which files. The first job looks for such a run, and
# the test jobs are skipped when it finds one. So a push that changes nothing CI tests costs one short job, and so does a
# commit that several branches share, pushed under one after the other.
#
# There is deliberately no concurrency group: a push never supersedes an in-flight run of the same branch, so every pushed
# commit is verified on its own rather than being cancelled by whatever was pushed next.
#
# Branches named flake-hunt/** are left out: such a branch exists to reproduce one intermittent failure with the flake-hunt
# workflow (flake-hunt.yml), whose runners the full matrix would otherwise queue behind on every push of the hunt.
#
# Only the push trigger is used, deliberately: a pull_request trigger would double-verify every same-repo PR (once for
# the push event, once for the PR event) and — because github.sha on a PR event is the ephemeral merge commit, not the
# PR head — the first job below cannot tell that the pair is one commit. Every branch is already covered by push. Re-add pull_request
# only if CI must run on fork PRs (a fork's push fires in the fork, not here).

name: CI

on:
  push:
    branches: ['**', '!flake-hunt/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skips the test jobs when an earlier CI run covers this commit, and has passed or is still running. Two cases make up
  # nearly all of it: a push that changes only files CI doesn't test, and a commit that several branches share, pushed
  # under one after the other. .github/scripts/Find-EarlierCiRunCoveringCommit.ps1 says how it decides, and why some run
  # always tests.
  #
  # GitHub's own means can express neither case. A paths filter on the trigger looks at what one push changed, not at
  # whether what the commit has was tested, and it reads at most 300 changed files. A concurrency group can cancel the
  # old run or queue the new one, never drop the duplicate.
  #
  # A covering run that failed doesn't count, so a push after a failure tests again. To test a commit again without
  # pushing, run this workflow by hand: a manual run (workflow_dispatch) is a request to test, so it looks for nothing.
  earlier-run-covering-this-commit:
    name: Look for an earlier CI run that covers this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      found: ${{ steps.look.outputs.found }}
    steps:
      - if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # The commit is compared with its ancestors ...
          filter: blob:none  # ... by which files differ, which takes no file contents.
          sparse-checkout: .github/scripts

      - id: look
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/Find-EarlierCiRunCoveringCommit.ps1 -Repository '${{ github.repository }}' -CommitSha '${{ github.sha }}' -RunId ${{ github.run_id }}

  build-and-test:
    needs: earlier-run-covering-this-commit
    if: needs.earlier-run-covering-this-commit.outputs.found != 'true'
    runs-on: ubuntu-latest

    # The backstop, not the hang mechanism: --blame-hang (see the build-and-test action) is what catches a hung test, dumps its
    # stacks and fails fast. This only caps what a hang GitHub's default would otherwise let run for six hours - a hang the dump
    # cannot catch because it is outside test execution, or the test driver itself wedged. Generous on purpose: these jobs take
    # four to ten minutes, and a hang dump costs the ten-minute detection window plus writing the dump before the step fails.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        persistence: [SqliteMemory, Sqlite, PgSql, MySql, MsSql]
        di: [Microsoft, Autofac, DryIoc, LightInject]
        serializer: [Newtonsoft]
        transport: [AspNetCore, NamedPipes]

    name: "Test (${{ matrix.persistence }}:${{ matrix.di }}:${{ matrix.serializer }}:${{ matrix.transport }})"

    services:
      postgres:
        image: ${{ matrix.persistence == 'PgSql' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: "Development!1"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: ${{ matrix.persistence == 'MySql' && 'mysql:8' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: "Development!1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mssql:
        image: ${{ matrix.persistence == 'MsSql' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Development!1"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Development!1' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Development!1' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      COMPOSABLE_MACHINE_SLOWNESS: "5.0"
      COMPOSABLE_PERFORMANCE_TESTS_STRESS_TEST_ONLY: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      COMPOSABLE_MSSQL_DATABASE_POOL_MASTER_CONNECTIONSTRING: ${{ matrix.persistence == 'MsSql' && 'Data Source=localhost;Initial Catalog=master;User Id=sa;Password=Development!1;TrustServerCertificate=True;' || '' }}

    steps:
      - uses: actions/checkout@v7

      - if: matrix.persistence == 'PgSql'
        uses: ./.github/actions/postgresql-logs-lock-waits
        with:
          container-id: ${{ job.services.postgres.id }}

      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          configuration: Debug
          pluggable-components: "${{ matrix.persistence }}:${{ matrix.di }}:${{ matrix.serializer }}:${{ matrix.transport }}"

  # Windows coverage for the container-free persistence layers. The DB engines run only on Linux because GitHub's service
  # containers (postgres/mysql/mssql images) cannot be hosted on a Windows runner, but SqliteMemory and Sqlite need no
  # container - so they run here to exercise the genuinely platform-divergent code CI otherwise never touches on Windows:
  # the named-pipe transport (Win32 kernel pipes vs the Unix-domain-socket emulation on Linux), the Sqlite process lock's
  # OS mutex, and Windows path / file-locking / line-ending handling. A separate job rather than an os matrix axis so the
  # services block above stays off Windows entirely.
  build-and-test-windows:
    needs: earlier-run-covering-this-commit
    if: needs.earlier-run-covering-this-commit.outputs.found != 'true'
    runs-on: windows-latest

    # Same backstop, same reasoning as the Linux job above.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        persistence: [SqliteMemory, Sqlite]
        di: [Microsoft, Autofac, DryIoc, LightInject]
        serializer: [Newtonsoft]
        transport: [AspNetCore, NamedPipes]

    name: "Windows Test (${{ matrix.persistence }}:${{ matrix.di }}:${{ matrix.serializer }}:${{ matrix.transport }})"

    env:
      COMPOSABLE_MACHINE_SLOWNESS: "5.0"
      COMPOSABLE_PERFORMANCE_TESTS_STRESS_TEST_ONLY: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          configuration: Debug
          pluggable-components: "${{ matrix.persistence }}:${{ matrix.di }}:${{ matrix.serializer }}:${{ matrix.transport }}"

# Create Releases: publishes every package whose version has no release tag yet to nuget.org, with its GitHub release and tag.
#
# Run it by hand, and only after the CI workflow (ci.yml) has passed on the same commit. The Build and Test step below runs
# only the combinations in src/TestUsingPluggableComponentCombinations.github-ci - three, all SqliteMemory, on Linux - while
# CI runs the full pluggable-component matrix on Linux and Windows. The first step enforces it: the release gate
# (.github/scripts/Assert-CiPassedForCommit.ps1) stops the release unless a CI run of this commit ran its test jobs and all
# its jobs succeeded. The release procedure: .claude/rules/02-universal-compze/100-releasing.md.

name: Create Releases

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: false

permissions:
  actions: read    # lets the release gate read the CI workflow's runs and jobs for this commit
  contents: write
  id-token: write  # lets the nuget.org Trusted Publishing step request the GitHub OIDC token that nuget.org exchanges for a short-lived API key

jobs:
  publish:
    runs-on: ubuntu-latest
    name: ${{ inputs.dry-run && 'Dry Run' || 'Publish' }}

    env:
      COMPOSABLE_MACHINE_SLOWNESS: "5.0"
      COMPOSABLE_PERFORMANCE_TESTS_STRESS_TEST_ONLY: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history needed for tag detection

      # The release gate: the Build and Test step below tests only three combinations, so nothing is published from a
      # commit the CI workflow hasn't fully tested. A dry run reports the gate's verdict and goes on.
      - name: Require that CI passed on this commit
        continue-on-error: ${{ inputs.dry-run == true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/Assert-CiPassedForCommit.ps1 -Repository '${{ github.repository }}' -CommitSha '${{ github.sha }}'

      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          configuration: Release

      - name: Pack
        shell: pwsh
        run: |
          Import-Module ./DevScripts/Compze.psm1 -DisableNameChecking
          C-Pack -CI -NoBuild

      # nuget.org Trusted Publishing: a policy on nuget.org (owner MagnusLidbom) trusts repository
      # mlidbom/Compze, workflow file publish-nuget.yml. Renaming this file or the repository stops
      # publishing until that policy is updated. The key expires after one hour, so this step stays
      # immediately before the push rather than before the build and test run.
      - name: Get short-lived nuget.org API key (Trusted Publishing)
        if: ${{ !inputs.dry-run }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: MagnusLidbom

      - name: Publish packages and create GitHub releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}  # empty on a dry run, where the login step is skipped
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if ($env:DRY_RUN -eq 'true') {
            .github/scripts/Publish-NuGetWithReleases.ps1 -DryRun -Verbose
          } else {
            .github/scripts/Publish-NuGetWithReleases.ps1 -Verbose
          }
